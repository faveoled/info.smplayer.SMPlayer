app-id: info.smplayer.SMPlayer
runtime: org.kde.Platform
runtime-version: '5.15-24.08'
sdk: org.kde.Sdk
rename-desktop-file: smplayer.desktop
rename-appdata-file: smplayer.appdata.xml
rename-icon: smplayer
command: smplayer
finish-args:
  - '--share=ipc'
  - '--share=network'
  - '--socket=x11'
  - '--socket=pulseaudio'
  - '--device=dri'
  - '--filesystem=host'
  - '--talk-name=org.freedesktop.ScreenSaver'
  - '--own-name=org.mpris.MediaPlayer2.smplayer'
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '24.08'
    directory: lib/ffmpeg
    add-ld-path: .
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg
modules:
  - name: smplayer
    buildsystem: simple
    build-options:
      env:
        QMAKEPATH: /app/lib
      arch:
        x86_64:
          env:
            QDEFOPTS: DEFINES+=USE_SHM DEFINES+=USE_GL_WINDOW DEFINES+=NO_MPLAYER
        aarch64:
          env:
            QDEFOPTS: DEFINES+=USE_SHM DEFINES+=NO_MPLAYER
    build-commands:
      - make PREFIX=/app QMAKE_OPTS="$QDEFOPTS" -j$FLATPAK_BUILDER_N_JOBS install
      - install -Dm644 icons/smplayer.svg /app/share/icons/hicolor/scalable/apps/smplayer.svg
    sources:
      - type: git
        url: https://github.com/smplayer-dev/smplayer.git
        tag: v24.5.0
        commit: dc37d6faef17b1892d30ab31ec1295ec09e803ea
        disable-shallow-clone: true

    modules:
      - name: libmpv
        cleanup:
          - /share/bash-completion
          - /share/zsh
          - /share/doc
          - /share/icons
          - /share/applications
        buildsystem: meson
        config-opts:
          - -Dlibmpv=true
          - -Dlua=enabled
          - -Ddebug=false
          - -Dbuild-date=false
          - -Dalsa=disabled
          - -Dmanpage-build=disabled
        sources:
          - type: archive
            url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.40.0.tar.gz
            sha256: 10a0f4654f62140a6dd4d380dcf0bbdbdcf6e697556863dc499c296182f081a3
            x-checker-data:
              type: anitya
              project-id: 5348
              stable-only: true
              url-template: https://github.com/mpv-player/mpv/archive/refs/tags/v$version.tar.gz
          - type: patch
            path: fix-hwdec.diff
        modules:
          - name: luajit
            no-autogen: true
            make-args:
              - BUILDMODE=dynamic
              - PREFIX=${FLATPAK_DEST}
            make-install-args:
              - PREFIX=${FLATPAK_DEST}
            sources:
              - type: git
                url: https://github.com/openresty/luajit2.git
                tag: v2.1-20250117
                commit: 93162f34e7424cd0ea3c4046a9ffacce621626bc
                x-checker-data:
                  type: git
                  tag-pattern: ^v([\d.-]+)$
                  stable-only: false
            cleanup:
                 
          - name: libplacebo
            buildsystem: meson
            config-opts:
              - -Dd3d11=disabled
              - -Ddemos=False
            sources:
              - type: archive
                url: https://code.videolan.org/videolan/libplacebo/-/archive/v7.349.0/libplacebo-v7.349.0.tar.gz
                sha256: 79120e685a1836344b51b13b6a5661622486a84e4d4a35f6c8d01679a20fbc86
                x-checker-data:
                  type: anitya
                  project-id: 20101
                  stable-only: true
                  url-template: https://code.videolan.org/videolan/libplacebo/-/archive/v$version/libplacebo-v$version.tar.gz
              - type: archive
                url: https://github.com/pallets/jinja/archive/refs/tags/3.1.6.tar.gz
                sha256: 2074b22a72caa65474902234b320d73463d6d4c223ee49f4b433495758356337
                dest: 3rdparty/jinja
                x-checker-data:
                  type: anitya
                  project-id: 3894
                  url-template: https://github.com/pallets/jinja/archive/refs/tags/$version.tar.gz
              - type: archive
                url: https://github.com/Dav1dde/glad/archive/refs/tags/v2.0.8.tar.gz
                sha256: 44f06f9195427c7017f5028d0894f57eb216b0a8f7c4eda7ce883732aeb2d0fc
                dest: 3rdparty/glad
                x-checker-data:
                  type: anitya
                  project-id: 300234
                  url-template: https://github.com/Dav1dde/glad/archive/refs/tags/v$versi      
          - name: libXpresent
            buildsystem: autotools
            sources:
              - type: archive
                url: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.1.tar.xz
                sha256: b964df9e5a066daa5e08d2dc82692c57ca27d00b8cc257e8e960c9f1cf26231b
                x-checker-data:
                  type: anitya
                  project-id: 17166
                  stable-only: true
                  url-template: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-$versi      
          - name: libass
            config-opts:
              - --disable-static
            sources:
              - type: archive
                url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.gz
                sha256: da7c348deb6fa6c24507afab2dee7545ba5dd5bbf90a137bfe9e738f7df68537
                x-checker-data:
                  type: anitya
                  project-id: 1560
                  stable-only: true
                  url-template: https://github.com/libass/libass/releases/download/$version/libass-$versi      
          - name: uchardet
            buildsystem: cmake-ninja
            config-opts:
              - -DCMAKE_BUILD_TYPE=Release
              - -DBUILD_STATIC=0
            cleanup:
              - /bin
            sources:
              - type: archive
                url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
                sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
                x-checker-data:
                  type: anitya
                  project-id: 9265
                  stable-only: true
                  url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz


      - name: mplayer
        disabled: true
        buildsystem: autotools
        build-options:
          arch:
            x86_64:
              config-opts:
                - --enable-runtime-cpudetection
        config-opts:
          - --disable-gui
          - --disable-mencoder
          - --extra-libs-mplayer=-lrt
          - --disable-libmpeg2-internal
          - --disable-ffmpeg_a
          - --yasm=
        sources:
          - type: git
            url: https://github.com/smplayer-dev/mplayer-mod.git
            tag: v1.5-110
            commit: ea47c72e2b91a0a42fd2723f075bd7adb43ec55a

      - name: smplayer-skins
        buildsystem: simple
        build-commands:
          - make PREFIX=/app
          - make PREFIX=/app install
        sources:
          - type: archive
            url: https://sourceforge.net/projects/smplayer/files/SMPlayer-skins/20.11.0/smplayer-skins-20.11.0.tar.bz2
            sha256: 3bbfe7f31f2ebaa158b9e7c9f7601b0116eb375bb577cf65e313a9a45c622973

      - name: smplayer-themes
        buildsystem: simple
        build-commands:
          - make PREFIX=/app
          - make PREFIX=/app install
        sources:
          - type: archive
            url: https://sourceforge.net/projects/smplayer/files/SMPlayer-themes/20.11.0/smplayer-themes-20.11.0.tar.bz2
            sha256: b99c02a13e5587e0c59d127d2f2536a1bc2740e726fadb47c89d349df5951132

